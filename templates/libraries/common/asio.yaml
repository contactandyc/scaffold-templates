kind: git
url: https://github.com/chriskohlhoff/asio.git
branch: asio-1-30-2
shallow: true
build_steps:
  # 1 & 2. Isolated Environment & Permission Safety applied here:
  - (cd asio && ./autogen.sh)
  - (cd asio && ./configure --prefix=${PREFIX:-/usr/local})
  - (cd asio && make -j"$(nproc)")
  - (cd asio && ${SUDO}make install)

find_package: null
pkg_config: asio
link: asio

