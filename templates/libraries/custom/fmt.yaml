kind: git
url: https://github.com/contactandyc/restinio.git
branch: v.0.7.3-fork
shallow: true
build_steps:
  - cmake -S fmt -B fmt/build -DCMAKE_INSTALL_PREFIX=${PREFIX:-/usr/local}
  - cmake --build fmt/build -j"$(nproc)"
  - ${SUDO}cmake --install fmt/build
find_package: "fmt REQUIRED"
link: "fmt::fmt"

license_spdx: MIT
attribution: "fmt by Victor Zverovich — MIT"

notices:
