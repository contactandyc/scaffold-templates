kind: git
url: https://github.com/contactandyc/restinio.git
branch: v.0.7.3-fork
shallow: true
build_steps:
  - cmake -S expected-lite -B expected-lite/build -DCMAKE_INSTALL_PREFIX=${PREFIX:-/usr/local}
  - cmake --build expected-lite/build -j"$(nproc)"
  - ${SUDO}cmake --install expected-lite/build
find_package: "expected-lite CONFIG REQUIRED"
link: "nonstd::expected-lite"

license_spdx: BSL-1.0
attribution: "expected-lite by Martin Moene — BSL-1.0"

notices:
